[package]
name = "chrono-judge-cost-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
vstd = "=0.0.0-2026-04-20-1748"
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-registration-fixture = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
chrono-judge-filemap = { git = "https://github.com/chrono-harness/chrono-harness-judge-filemap.git", rev = "545c03a0df4259921d927e3e9fffd9fa2b65c68d" }
chrono-judge-cost = { path = "../judge-cost" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "costs"
path = "tests/costs.rs"

[[test]]
name = "verified_cost"
path = "tests/verified_cost.rs"

[[test]]
name = "impact_summary"
path = "tests/impact_summary.rs"
