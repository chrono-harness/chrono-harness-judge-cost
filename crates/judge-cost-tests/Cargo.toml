[package]
name = "chrono-judge-cost-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
sha2 = "0.10"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
vstd = "=0.0.0-2026-04-20-1748"
chrono-judge-cost = { path = "../judge-cost" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "costs"
path = "tests/costs.rs"

[[test]]
name = "verified_cost"
path = "tests/verified_cost.rs"
